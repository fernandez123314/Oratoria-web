<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - EduCom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0369a1, #0c4a6e);
            min-height: 100vh;
            color: white;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 1rem;
        }
        /* Header y Navegación */
        .header {
            padding: 1rem 0;
        }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            color: #fcd34d;
            font-size: 2rem;
            font-weight: bold;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        .nav-item {
            text-align: center;
        }
        .nav-link {
            color: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-link:hover {
            color: #fcd34d;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
        }
        .social-links {
            display: flex;
            gap: 1rem;
        }
        .social-link {
            color: white;
            text-decoration: none;
        }
        .social-link.whatsapp { color: #25D366; }
        .blog-header {
            margin-bottom: 3rem;
        }
        .blog-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .blog-subtitle {
            font-size: clamp(1.25rem, 3vw, 1.5rem);
            color: rgba(255, 255, 255, 0.9);
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .blog-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }
        .blog-card:hover {
            transform: translateY(-5px);
        }
        .blog-card-image {
            width: 100%;
            height: 200px;
            border-radius: 0.5rem;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .blog-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .blog-card:hover .blog-card-image img {
            transform: scale(1.05);
        }
        .blog-card-title {
            font-size: clamp(1.25rem, 2vw, 1.5rem);
            font-weight: bold;
            margin-bottom: 1rem;
            color: white;
        }
        /* Estilos para el menú móvil */
        .menu-button {
            display: none;
            background: transparent;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                background-color: #1d4ed8;
                width: 100%;
                z-index: 10;
            }
            .nav-links.active {
                display: flex;
            }
            .menu-button {
                display: block;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="/" class="logo">EduCom</a>
            <button class="menu-button" aria-label="Abrir menú">&#9776;</button>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="#" class="nav-link">

                        </svg>
                        Inicio

                </li>

                        </svg>
                        Blog

                </li>
                <li class="nav-item">
                    <a href="/shop.html" class="nav-link">

                        </svg>
                        Tienda online

                </li>

                        </svg>

                </li>
                <li class="nav-item">
                    <a href="/contact.html" class="nav-link">

                    </a>

                    </svg>
                </a>
            </div>
        </nav>
    </header>
    <section class="blog">
        <div class="container">
            <header class="blog-header">
                <h2 class="blog-title">Blog</h2>
                <p class="blog-subtitle">En que te ayuda la oratoria:</p>
            </header>
            <div class="blog-grid">
                <article class="blog-card">
                    <div class="blog-card-image">
                        <img src="/img/blog01.png" alt="Competencias lingüísticas">
                    </div>
                    <h3 class="blog-card-title">Mejora tus competencias lingüísticas.</h3>
                </article>
                <article class="blog-card">
                    <div class="blog-card-image">
                        <img src="/img/blog02.png" alt="Pensamiento crítico">
                    </div>
                    <h3 class="blog-card-title">Mejora la habilidad de pensamiento crítico.</h3>
                </article>
                <article class="blog-card">
                    <div class="blog-card-image">
                        <img src="/img/blog03.png" alt="Manejo de emociones">
                    </div>
                    <h3 class="blog-card-title">Maneja tus emociones y gestiona tu miedo.</h3>
                </article>
            </div>
        </div>
    </section>
    <script>
        // Menú responsive
        document.addEventListener('DOMContentLoaded', function() {
            const menuButton = document.querySelector('.menu-button');
            const navLinks = document.querySelector('.nav-links');

            menuButton.addEventListener('click', function() {
                navLinks.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
